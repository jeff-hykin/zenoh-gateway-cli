[package]
name = "zenoh-web-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "The zenoh-web command: zenoh-web with the ROS 2 / dimos codecs"
repository = "https://github.com/jeff-hykin/zenoh-web-cli"
publish = false

[[bin]]
name = "zenoh-web"
path = "src/main.rs"

[dependencies]
zenoh-web = { git = "https://github.com/jeff-hykin/zenoh-web", rev = "f6f9de2c5e3a069b871389460db3c33d88fcafa7" }
zenoh-dimos-codecs = { git = "https://github.com/jeff-hykin/zenoh-dimos-codecs", rev = "a1f7e21b246d7db97592a6bcf1f320253c4d2d78" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# the e2e suites' zenoh peer and the external-codec server (examples/)
[dev-dependencies]
zenoh = "=1.6.2"
zenoh-ext = { version = "=1.6.2", features = ["unstable"] }
serde_json = "1"
# custom_codec's AV1 encoder (an application's own encoder, as a hardware one would plug in)
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
