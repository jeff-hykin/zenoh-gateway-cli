[package]
name = "zenoh-web-cli"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "The zenoh-web command: zenoh-web with the ROS 2 / dimos codecs"
repository = "https://github.com/jeff-hykin/zenoh-web-cli"
license-file = "LICENSE"
readme = "README.md"
# only what building the command needs
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE"]

[[bin]]
name = "zenoh-web"
path = "src/main.rs"

[dependencies]
zenoh-web = { version = "0.4.0", git = "https://github.com/jeff-hykin/zenoh-web", rev = "fb465e704544008095a00b5416d68b6abc91147c" }
zenoh-dimos-codecs = { version = "0.2.0", git = "https://github.com/jeff-hykin/zenoh-dimos-codecs", rev = "665947feaa8c3b1b969929d7c16a9d072043bd76" }
# hardware video encoders, picked at startup (GStreamer is loaded at runtime, so building needs none)
zenoh-web-encoders = { version = "0.1.0", git = "https://github.com/jeff-hykin/zenoh-web-encoders", rev = "af0cffa3d67876f7c39e5386f6776b3b17212901", features = ["videotoolbox", "gstreamer"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
json5 = "0.4"

# the e2e suites' zenoh peer and the external-codec server (examples/)
[dev-dependencies]
# tests/zenoh_signalling.rs connects to the command the way zenoh-web-relay does
zenoh-web = { version = "0.4.0", git = "https://github.com/jeff-hykin/zenoh-web", rev = "fb465e704544008095a00b5416d68b6abc91147c", features = ["client"] }
zenoh = "=1.6.2"
zenoh-ext = { version = "=1.6.2", features = ["unstable"] }
serde_json = "1"
# custom_codec's AV1 encoder (an application's own encoder, as a hardware one would plug in)
rav1e = { version = "0.8", default-features = false, features = ["threading"] }

