[package]
name = "zenoh-web-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "The zenoh-web command: zenoh-web with the ROS 2 / dimos codecs"
repository = "https://github.com/jeff-hykin/zenoh-web-cli"
license-file = "LICENSE"
readme = "README.md"
# only what building the command needs
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE"]

[[bin]]
name = "zenoh-web"
path = "src/main.rs"

[dependencies]
zenoh-web = { version = "0.3.0", git = "https://github.com/jeff-hykin/zenoh-web", rev = "0cdee77e81dcbe87e70b8524a7413ce7470b7de3" }
zenoh-dimos-codecs = { version = "0.1.0", git = "https://github.com/jeff-hykin/zenoh-dimos-codecs", rev = "8fe2215ba328fbda546a283bba5a54a124141d92" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
json5 = "0.4"

# the e2e suites' zenoh peer and the external-codec server (examples/)
[dev-dependencies]
zenoh = "=1.6.2"
zenoh-ext = { version = "=1.6.2", features = ["unstable"] }
serde_json = "1"
# custom_codec's AV1 encoder (an application's own encoder, as a hardware one would plug in)
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
