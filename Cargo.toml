[package]
name = "zenoh-gateway-cli"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "The zenoh-gateway command: zenoh-gateway with the ROS 2 / dimos codecs"
repository = "https://github.com/jeff-hykin/zenoh-gateway-cli"
license-file = "LICENSE"
readme = "README.md"
# only what building the command needs
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE"]

[[bin]]
name = "zenoh-gateway"
path = "src/main.rs"

[dependencies]
zenoh-gateway = { version = "0.5.0", features = ["cloudflare"] }
# the codecs, and the hardware video encoders picked at startup (GStreamer is loaded at runtime, so building needs none)
zenoh-dimos-codecs = { version = "0.3.0", features = ["videotoolbox", "gstreamer"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
json5 = "0.4"
serde_json = "1"

# the e2e suites' zenoh peer and the external-codec server (examples/)
[dev-dependencies]
# tests/zenoh_signalling.rs connects to the command the way zenoh-gateway-relay does
zenoh-gateway = { version = "0.5.0", features = ["client"] }
zenoh = "=1.6.2"
zenoh-ext = { version = "=1.6.2", features = ["unstable"] }
# custom_codec's AV1 encoder (an application's own encoder, as a hardware one would plug in)
rav1e = { version = "0.8", default-features = false, features = ["threading"] }

[patch.crates-io]
# zenoh 1.6.2 plus a routing fix (puts dropped after a publisher is undeclared): https://github.com/jeff-hykin/zenoh-vendor
zenoh = { git = "https://github.com/jeff-hykin/zenoh-vendor", tag = "zenoh-1.6.2-patch.1" }
